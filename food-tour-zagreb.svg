  <rect x="95" y="132" width="24" height="7" rx="3" fill="#e94560"/>
  <text x="162" y="140" fill="#ffffff" font-size="9">2/5</text>

  <text x="35" y="159" fill="#aaaacc" font-size="9">😋 Okus</text>
  <rect x="95" y="149" width="60" height="7" rx="3" fill="#1a1a3e"/>
  <rect x="95" y="149" width="42" height="7" rx="3" fill="#f5a623"/>
  <text x="162" y="157" fill="#ffffff" font-size="9">3.5/5</text>

  <text x="35" y="176" fill="#aaaacc" font-size="9">⚖️ Vrijedn.</text>
  <rect x="95" y="166" width="60" height="7" rx="3" fill="#1a1a3e"/>
  <rect x="95" y="166" width="42" height="7" rx="3" fill="#f5a623"/>
