<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0a2744;stop-opacity:0.9" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e94560" opacity="0.8"/>
    </marker>
    <!-- Street grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Subtle map-like roads -->
  <!-- Harambašićeva street (horizontal left) -->
  <line x1="60" y1="290" x2="340" y2="290" stroke="#2a4a7f" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
  <line x1="60" y1="290" x2="340" y2="290" stroke="#3a6aaf" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- Mije Krešića street (horizontal right) -->
  <line x1="460" y1="310" x2="740" y2="310" stroke="#2a4a7f" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
  <line x1="460" y1="310" x2="740" y2="310" stroke="#3a6aaf" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- Connecting road -->
  <path d="M 340 290 Q 400 290 460 310" stroke="#2a4a7f" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Kennedy Trg circle -->
  <circle cx="200" cy="350" r="35" fill="none" stroke="#2a4a7f" stroke-width="10" opacity="0.4"/>
  <circle cx="200" cy="350" r="35" fill="none" stroke="#3a6aaf" stroke-width="3" opacity="0.2"/>

  <!-- Title area -->
  <rect x="0" y="0" width="800" height="70" fill="#000" opacity="0.3"/>
  <text x="400" y="28" text-anchor="middle" fill="#e94560" font-size="11" letter-spacing="6" font-family="Georgia" opacity="0.9">ZAGREB</text>
  <text x="400" y="55" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold" letter-spacing="2">🍽️ FOOD TOUR RUTA</text>

  <!-- Route line with arrows -->
  <!-- 1→2 -->
  <line x1="148" y1="275" x2="192" y2="275" stroke="#e94560" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)" opacity="0.7"/>
  <!-- 2→3 -->
  <path d="M 218 290 Q 218 355 175 355" stroke="#e94560" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  <!-- 3→4 -->
  <path d="M 230 360 Q 420 360 490 310" stroke="#e94560" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  <!-- 4→5 -->
  <line x1="540" y1="297" x2="590" y2="297" stroke="#e94560" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)" opacity="0.7"/>

  <!-- ===== LOCATION 1 ===== -->
