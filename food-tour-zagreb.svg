  <rect x="515" y="161" width="48" height="7" rx="3" fill="#4caf50"/>
  <text x="582" y="169" fill="#ffffff" font-size="9">4/5</text>

  <text x="455" y="188" fill="#aaaacc" font-size="9">⚖️ Vrijedn.</text>
  <rect x="515" y="178" width="60" height="7" rx="3" fill="#1a1a3e"/>
  <rect x="515" y="178" width="36" height="7" rx="3" fill="#f5a623"/>
  <text x="582" y="186" fill="#ffffff" font-size="9">3/5</text>

  <text x="540" y="222" text-anchor="middle" fill="#8899bb" font-size="8" font-style="italic">Fino, ali premalo za cijenu.</text>

  <!-- ===== LOCATION 5 - Urban Kebab (STAR) ===== -->
  <!-- Star glow effect -->
  <circle cx="620" cy="295" r="28" fill="#f5a623" opacity="0.15" filter="url(#glow)"/>
  <circle cx="620" cy="295" r="20" fill="#f5a623" filter="url(#glow)"/>
  <circle cx="620" cy="295" r="16" fill="#e8960f"/>
