  <text x="120" y="100" text-anchor="middle" fill="#e94560" font-size="9" letter-spacing="2">HARAMBAŠIĆEVA 31</text>
  <text x="120" y="118" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Restoran</text>
  <line x1="40" y1="126" x2="200" y2="126" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  <!-- Stars row -->
