<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P@T | Školski Digitalni Časopis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #ffffff; --bg-secondary: #f8f9fa; --bg-dark: #111111;
            --text-main: #111111; --text-muted: #666666; --accent-blue: #0f2d59;
            --border-color: #e5e5e5; --radius: 12px; --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); line-height: 1.6; }
        header { border-bottom: 1px solid var(--border-color); padding: 1.5rem 2rem; position: sticky; top: 0; background: #fff; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 2rem; font-weight: 800; cursor: pointer; }
        .logo span { color: var(--accent-blue); }
        .container { max-width: 1200px; margin: 0 auto; padding: 4rem 2rem; }
        .hero { background: var(--bg-dark); color: #ffffff; padding: 6rem 2rem; text-align: center; }
        .featured-card { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-secondary); border-radius: var(--radius); overflow: hidden; margin-bottom: 4rem; cursor: pointer; }
        .featured-content { padding: 3rem; display: flex; flex-direction: column; justify-content: center; }
        .articles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2.5rem; }
        .article-card { border: 1px solid var(--border-color); border-radius: var(--radius); padding: 1.5rem; cursor: pointer; transition: var(--transition); }
        .article-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem; }
        footer { background: var(--bg-dark); color: white; text-align: center; padding: 3rem; margin-top: 5rem; }
    </style>
</head>
<body>

    <header>
        <nav class="nav-container">
            <div class="logo" onclick="window.location.reload()">P<span>@</span>T</div>
        </nav>
    </header>

    <main class="container">
        <section class="hero"><h1>P@T</h1><p>Digitalni časopis naše škole.</p></section>
        
        <h2>Istaknuta priča</h2>
        <div id="featured" class="featured-card"></div>

        <h2>Svi članci</h2>
        <div id="grid" class="articles-grid" style="margin-top: 2rem;"></div>
    </main>

    <footer><p>© 2026 Školski digitalni časopis P@T.</p></footer>

    <script>
        const articles = [
            { title: "Točno u podne", summary: "Obračun iz matematike", img: "josip.jpg" },
            { title: "Školski stres", summary: "Kako preživjeti kraj godine", img: "Slika - stres.jpg" },
            { title: "Erasmus+ Italija", summary: "Rimska avantura", img: "Veronika 3.jpg" },
            { title: "Gastro Vodič", summary: "Mlinar vs Konzum", img: "IMG_0795 (1).jpeg" },
            { title: "Energetska pića", summary: "Opasnost u limenkama", img: "GettyImages-1025255964.jpg" },
            { title: "Cvjetni hodnik", summary: "Kreativnost na djelu", img: "Cvjetni hodnik.jpg" },
            { title: "Filmska skupina", summary: "Novi hit u nastajanju", img: "Slika - film.jpg" },
            { title: "Umjetna inteligencija", summary: "Prijatelj ili neprijatelj?", img: "240_F_485241075_B97HJPtsCLaHVOMGBtNyQm6LzzZtGUmh.jpg" },
            { title: "Inovacije", summary: "Profesor Danijel Eskeričić", img: "{49D3CF66-F233-4D20-B791-029AE6F2D89B}.png" }
        ];

        const featured = document.getElementById('featured');
        const grid = document.getElementById('grid');

        // Istaknuta priča
        featured.innerHTML = `
            <img src="${articles[0].img}" onerror="this.style.display='none'">
            <div class="featured-content">
                <h3>${articles[0].title}</h3>
                <p>${articles[0].summary}</p>
            </div>`;

        // Ostali članci
        articles.forEach(art => {
            grid.innerHTML += `
                <div class="article-card">
                    <img src="${art.img}" onerror="this.style.display='none'">
                    <h3>${art.title}</h3>
                    <p>${art.summary}</p>
                </div>`;
        });
    </script>
</body>
</html>
